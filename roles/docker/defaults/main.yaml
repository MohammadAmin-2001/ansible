docker__dependencies:
  - "apt-transport-https"
  - "ca-certificates"
  - "curl"
  - "software-properties-common"

docker__packages:
  - "docker-ce"
  - "docker-ce-cli"
  - "docker-ce-rootless-extras"
  - "containerd.io"

docker__gpg_key_url : "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
docker__gpg_system_path: "/etc/apt/keyrings/docker.asc"



