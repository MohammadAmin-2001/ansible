---
- name: get deb package from link
  ansible.builtin.get_url:
   url: "{{ cuda_cuda__deb_url }}"
   dest: "{{ cuda__deb_local_path }}" # https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/get_url_module.html
   force: false # https://docs.ansible.com/projects/ansible/latest/collections/ansible/builtin/get_url_module.html
   mode: "666"
  
   
  
  